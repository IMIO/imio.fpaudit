[buildout]

extends =
    https://raw.githubusercontent.com/collective/buildout.plonetest/master/test-4.3.x.cfg
    base.cfg

# update-versions-file = test-4.3.cfg

index = https://pypi.org/simple/

eggs +=
    Products.DocFinderTab
    aws.zope2zcmldoc

auto-checkout -=
    collective.documentgenerator

# http://<your-zope-root>/@@install-aws-zope2zcmldoc

auto-checkout +=
    appy
    collective.documentgenerator

[sources]
appy = git ${remotes:imio}/appy.git pushurl=${remotes:imio_push}/appy.git branch=master
collective.documentgenerator = git ${remotes:col}/collective.documentgenerator.git pushurl=${remotes:col_push}/collective.documentgenerator.git branch=3.x

[versions]
zc.buildout = 3.4
setuptools = 44.1.1
beautifulsoup4 = 4.9.3
collective.documentgenerator = 3.45
future = 0.18.3
six = 1.16.0

# Max version for Plone 4.3
Products.ExternalEditor = 1.1.3
backports.functools-lru-cache = 1.6.4
collective.excelexport = 1.8.3
collective.externaleditor = 1.0.3
collective.upgrade = 1.5
natsort = 6.2.1
plone.api = 1.10.4
plone.app.textfield = 1.3.4
plone.versioncheck = 1.8.2
z3c.table = 2.2
z3c.unconfigure = 1.0.1
collective.z3cform.datagridfield = 1.3.3
plone.formwidget.namedfile = 2.0.5
plone.testing = 5.0.0
zc.lockfile = 1.4

# Required by:
# imio.helpers==1.3.11.dev0
cryptography = 3.3.2
cffi = 1.15.1
ipaddress = 1.0.23
pycparser = 2.21

ipdb = 0.13.13
Pygments = 2.5.2

# Required by:
# ipdb
backports.shutil-get-terminal-size = 1.0.0
enum34 = 1.1.6
# <6 for py2.7
ipython = 5.10.0
ipython-genutils = 0.2.0
iw.debug = 0.3
pathlib = 1.0.1
pathlib2 = 2.3.5
pexpect = 4.6.0
pickleshare = 0.7.4
prompt-toolkit = 1.0.15
ptyprocess = 0.6.0
scandir = 1.10.0
simplegeneric = 0.8.1
